# enable zmk studio for realtime keymap updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- Bluetooth reliability fix ---
# Deep sleep: power down fully after 30 min idle so the keyboard wakes clean
# and reconnects instead of getting stuck "connecting" after long periods off.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Max BLE transmit power (negligible battery cost) to reduce dropouts.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y